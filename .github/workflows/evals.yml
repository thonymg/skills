name: Skill evals (manuel — consomme du budget API)

on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill à évaluer"
        required: true
        default: naming-convention
        type: choice
        options: [naming-convention, archi-vide]
      trials:
        description: "Trials par cas"
        required: true
        default: "3"

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run trigger evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 evals/run-evals.py "${{ inputs.skill }}" --trials "${{ inputs.trials }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
