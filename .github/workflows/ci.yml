name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linter-tests:
    name: Tests fixtures du linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run linter regression tests
        run: bash tests/run-linter-tests.sh

  svelte-strict-tests:
    name: Tests svelte-strict (RuleTester + svs end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned tooling
        run: npm ci --prefix skills/svelte-strict/tooling --no-audit --no-fund
      - name: Run svelte-strict tests
        run: bash tests/run-svelte-strict-tests.sh

  pocketbase-go-tests:
    name: Tests pocketbase-go (analysistest + pbg on a real PocketBase app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run pocketbase-go tests
        env:
          GOTOOLCHAIN: auto
        run: bash tests/run-pocketbase-go-tests.sh

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck linter scripts
        run: |
          shellcheck -S error \
            skills/naming-convention/linter/lint.sh \
            skills/naming-convention/linter/lib/*.sh \
            skills/naming-convention/linter/checks/*.sh \
            tests/run-linter-tests.sh \
            tests/run-svelte-strict-tests.sh \
            tests/run-pocketbase-go-tests.sh
